<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#080c10">
    <title>Draftside War Room</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#workspace-title">Skip to draft decisions</a>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">DS</span>
        <div>
          <p class="eyebrow">War room</p>
          <h1>Draftside</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="draft-clock" role="timer" aria-label="Time until the managed team picks">
          <span class="clock-label">Pick clock</span>
          <strong id="pick-clock">--:--</strong>
        </div>
        <div id="connection-pill" class="connection-pill is-loading" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="connection-label">Connecting</span>
        </div>
      </div>
    </header>

    <main id="main">
      <section class="draft-strip" aria-labelledby="draft-progress-title">
        <div class="draft-strip-copy">
          <p class="eyebrow" id="draft-progress-title">Live draft</p>
          <p><strong id="pick-label">Loading board…</strong> <span id="round-label"></span></p>
        </div>
        <div class="progress-wrap">
          <div class="progress-meta"><span id="progress-copy">Waiting for snapshot</span><span id="last-sync">—</span></div>
          <div class="progress-track" role="progressbar" aria-label="Draft completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span id="progress-fill"></span>
          </div>
        </div>
        <div class="next-pick">
          <span>Your team picks</span>
          <strong id="next-pick">—</strong>
        </div>
      </section>

      <div id="alert-region" class="alert-stack" aria-live="assertive"></div>

      <section class="control-deck" aria-label="War Room controls">
        <div id="decision-tabs" class="decision-tabs" aria-label="Decision views" role="tablist">
          <button class="decision-tab is-active" type="button" role="tab" data-tab="NEXT" aria-selected="true">Next Up</button>
          <button class="decision-tab" type="button" role="tab" data-tab="RB" aria-selected="false">RB</button>
          <button class="decision-tab" type="button" role="tab" data-tab="WR" aria-selected="false">WR</button>
          <button class="decision-tab" type="button" role="tab" data-tab="TE" aria-selected="false">TE</button>
          <button class="decision-tab" type="button" role="tab" data-tab="QB" aria-selected="false">QB</button>
          <button class="decision-tab" type="button" role="tab" data-tab="K" aria-selected="false">K</button>
          <button class="decision-tab" type="button" role="tab" data-tab="D/ST" aria-selected="false">D/ST</button>
        </div>
        <div id="roster-summary" class="roster-summary" aria-live="polite"></div>
      </section>

      <section id="workspace" class="workspace" aria-labelledby="workspace-title" aria-live="polite">
        <header class="workspace-heading">
          <div>
            <p id="workspace-eyebrow" class="eyebrow">Decision brief</p>
            <h2 id="workspace-title">Next Up</h2>
          </div>
          <p id="workspace-note" class="workspace-note">Roster fit, vanishing roles, and objective market falls.</p>
        </header>
        <div id="workspace-content" class="workspace-content"></div>
      </section>
    </main>

    <footer>
      <span id="build-label">Local preview</span>
      <span id="revision-label">Revision —</span>
      <span id="research-label">Research not published</span>
      <span id="mode-label"></span>
    </footer>
  </body>
</html>
