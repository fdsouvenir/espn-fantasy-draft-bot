[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "draftside-companion"
version = "0.4.3"
description = "Draftside's read-only laptop companion for ESPN fantasy drafts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["websocket-client>=1.8,<2"]

[project.optional-dependencies]
keyring = ["keyring>=25,<26"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
draft-companion = "draft_companion.cli:main"
draftside-companion-ui = "draft_companion.ui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/draft_companion"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/draft_companion/cli.py" = ["BLE001"]
"src/draft_companion/runtime.py" = ["BLE001"]
