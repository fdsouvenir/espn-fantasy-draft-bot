name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --include=dev
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: npm run check
      - run: python scripts/check_repository_safety.py

  companion:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check -e "./companion[dev]"
      - run: python -m ruff check companion/src companion/tests
      - run: python -m ruff format --check companion/src companion/tests
      - run: python -m pytest companion/tests

  ubuntu-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: packaging/debian/test-package.sh
      - name: Inspect package
        run: |
          package="$(find dist -maxdepth 1 -name 'draftside-companion_*-1_amd64.deb' -print -quit)"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          (cd dist && sha256sum -c "$(basename "$package").sha256")
          test "$(find dist -name '*.deb' | wc -l)" -eq 1
      - name: Install and remove on Ubuntu 24.04
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream lintian desktop-file-utils
          package="$(find dist -maxdepth 1 -name 'draftside-companion_*-1_amd64.deb' -print -quit)"
          lintian --fail-on error "$package"
          sudo apt-get install -y --no-install-recommends "./$package"
          appstreamcli validate --no-net --strict /usr/share/metainfo/com.draftside.companion.metainfo.xml
          desktop-file-validate /usr/share/applications/draftside-companion.desktop
          systemd-analyze verify /usr/lib/systemd/user/draftside-companion.service
          draftside-companion --help
          test_home="$(mktemp -d)"
          HOME="$test_home" \
            XDG_CONFIG_HOME="$test_home/.config" \
            XDG_STATE_HOME="$test_home/.local/state" \
            XDG_DATA_HOME="$test_home/.local/share" \
            draftside-companion-setup
          test "$(stat -c '%a' "$test_home/.config/draftside-companion/companion.toml")" = 600
          sudo apt-get purge -y draftside-companion
          test -f "$test_home/.config/draftside-companion/companion.toml"
          test ! -e /usr/bin/draftside-companion
      - uses: actions/upload-artifact@v4
        with:
          name: draftside-companion-ubuntu-24.04-amd64
          path: |
            dist/draftside-companion_*-1_amd64.deb
            dist/draftside-companion_*-1_amd64.deb.sha256
          if-no-files-found: error
